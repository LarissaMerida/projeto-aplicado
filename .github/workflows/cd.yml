name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    environment: production
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_SHA: sha-${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          IMAGE_SHA: ${{ env.IMAGE_SHA }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PATH,GHCR_IMAGE,IMAGE_SHA
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            IMAGE_NAME=$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            export APP_IMAGE="$IMAGE_NAME:$IMAGE_SHA"
            sudo docker compose pull web
            sudo docker compose up -d --no-build
            sudo  docker compose ps
